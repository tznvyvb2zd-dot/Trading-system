name: Intraday drop alerts

on:
  schedule:
    - cron: "10 8-16 * * 1-5"     # hourly, 08:10-16:10 UTC Mon-Fri (London market hours)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-run                # never overlaps with the daily run (both commit)
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check holdings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python src/alerts.py
      - name: Remember alerts sent today
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add data/uk_alerts_sent.json
          git diff --cached --quiet || (git commit -m "Alerts $(date -u +%F)" && git pull --rebase -q origin main && git push)
